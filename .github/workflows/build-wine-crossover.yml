name: Build wine-crossover

# Personal port: CodeWeavers' CrossOver sources, x86_64 under Rosetta 2,
# built and tested on macOS 27 (Apple silicon) only.

on:
  push:
    paths: ['emulators/wine-crossover/**', '.github/workflows/build-wine-crossover.yml', '.github/wine-crossover/**']
    branches: [main]
  pull_request:
    paths: ['emulators/wine-crossover/**', '.github/workflows/build-wine-crossover.yml', '.github/wine-crossover/**']
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'
        type: string

defaults:
  run:
    shell: bash

jobs:
  build-wine-crossover:
    name: build-wine-crossover (macOS_27)
    runs-on: macOS_27
    timeout-minutes: 480

    steps:
      - name: Gather system information
        continue-on-error: true
        run: |
          echo "Building port: wine-crossover"
          echo "Building from branch: ${{ inputs.branch || github.ref_name }}"
          sw_vers || true
          uname -m
          xcodebuild -version || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Check Rosetta 2
        run: |
          # wine's unix side is x86_64; configure runs its test programs
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 is installed"
          else
            echo "FAIL: Rosetta 2 is not installed on this runner"
            echo "Install it with: softwareupdate --install-rosetta --agree-to-license"
            exit 1
          fi

      - name: Setup MacPorts and BlakePorts Environment
        run: ./scripts/installmacports

      - name: Lint portfile
        run: |
          source ./setupenv.bash
          port lint --nitpick emulators/wine-crossover

      - name: Clean existing installation
        run: |
          source ./setupenv.bash
          if port -q installed wine-crossover 2>/dev/null | grep -q "wine-crossover @"; then
            echo "Removing existing wine-crossover installation..."
            sudo port uninstall wine-crossover
          else
            echo "No existing wine-crossover installation found"
          fi
          sudo port clean --work wine-crossover || true

      # No scripts/install-deps: it would install the libraries arm64 only, and
      # port install then has to rebuild them +universal for the x86_64 build.
      - name: Build port
        run: |
          source ./setupenv.bash
          # Not -v: the wine build log runs to hundreds of MB. Show the tail on failure.
          if ! sudo port -N -k install wine-crossover; then
            LOG=$(port logfile wine-crossover 2>/dev/null || true)
            if [ -n "$LOG" ] && [ -f "$LOG" ]; then
              echo "=== last 400 lines of $LOG ==="
              tail -400 "$LOG"
            fi
            exit 1
          fi

      - name: Verify installation
        run: |
          source ./setupenv.bash
          port installed wine-crossover
          echo ""
          echo "Universal dependencies:"
          port installed active | grep -E 'freetype|libsdl2|MoltenVK|gettext-runtime|libpcap'
          echo ""
          file /opt/local/bin/wine /opt/local/bin/wineserver
          file /opt/local/bin/wine | grep -q x86_64 || { echo "FAIL: wine is not x86_64"; exit 1; }
          echo ""
          /opt/local/bin/wine --version
          echo ""
          echo "Private gnutls:"
          CXLIB=/opt/local/libexec/wine-crossover/lib
          otool -L $CXLIB/libgnutls.30.dylib
          if otool -L $CXLIB/*.dylib | grep -q /work/cxdeps; then
            echo "FAIL: a private dylib still references the build directory"; exit 1
          fi
          # no grep -q: it exits at the first match and strings dies of SIGPIPE
          if strings /opt/local/lib/wine/x86_64-unix/bcrypt.so | grep $CXLIB/libgnutls.30.dylib > /dev/null; then
            echo "PASS: bcrypt.so dlopens $CXLIB/libgnutls.30.dylib"
          else
            echo "FAIL: bcrypt.so does not reference the private gnutls"; exit 1
          fi
          echo ""
          # wined3d's GL backend on macOS is winemac.drv's CGL code
          otool -L /opt/local/lib/wine/x86_64-unix/winemac.so | grep OpenGL.framework \
            || { echo "FAIL: winemac.so does not link OpenGL.framework"; exit 1; }
          echo ""
          echo "DXVK:"
          for arch in x86_64 i386; do
            for dll in dxgi d3d11 d3d10core; do
              f=/opt/local/lib/dxvk/$arch-windows/$dll.dll
              file $f
              want=$([ $arch = x86_64 ] && echo x86-64 || echo 80386)
              file $f | grep -q "$want" || { echo "FAIL: $f is not a $want PE DLL"; exit 1; }
            done
          done
          test -x /opt/local/bin/wine-dxvk || { echo "FAIL: wine-dxvk not installed"; exit 1; }

      - name: Smoke test
        run: |
          source ./setupenv.bash
          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          rm -rf "$WINEPREFIX"
          # perl alarm: a hung wine fails the step instead of the job timeout
          run() { perl -e 'alarm 600; exec @ARGV' /opt/local/bin/wine "$@" 2>&1 | grep -v mvk-info || true; }
          # A new prefix plus a 64-bit and a 32-bit (wow64) console program.
          OUT64=$(run cmd.exe /c echo wine64-ok)
          echo "$OUT64" | tail -5
          OUT32=$(run 'C:\windows\syswow64\cmd.exe' /c echo wine32-ok)
          echo "$OUT32" | tail -5
          # HTTPS through winhttp -> schannel -> the private gnutls, both bitnesses.
          printf '%s\r\n' \
            'var r = new ActiveXObject("WinHttp.WinHttpRequest.5.1");' \
            'r.Open("GET", "https://www.example.com/", false);' \
            'r.Send();' \
            'WScript.Echo("https-status=" + r.Status);' > "$WINEPREFIX/drive_c/https.js"
          TLS64=$(run cscript //nologo 'C:\https.js')
          echo "$TLS64" | tail -5
          TLS32=$(run 'C:\windows\syswow64\cscript.exe' //nologo 'C:\https.js')
          echo "$TLS32" | tail -5
          /opt/local/bin/wineserver -k || true
          echo "$OUT64" | grep -q wine64-ok || { echo "FAIL: 64-bit cmd.exe did not run"; exit 1; }
          echo "$OUT32" | grep -q wine32-ok || { echo "FAIL: 32-bit cmd.exe did not run"; exit 1; }
          echo "$TLS64" | grep -q https-status=200 || { echo "FAIL: 64-bit HTTPS request failed"; exit 1; }
          echo "$TLS32" | grep -q https-status=200 || { echo "FAIL: 32-bit HTTPS request failed"; exit 1; }
          echo "PASS: 64-bit and 32-bit cmd.exe run, HTTPS works from both"

      - name: Direct3D 11 test
        run: |
          source ./setupenv.bash
          export WINEPREFIX="$RUNNER_TEMP/wineprefix"
          export WINEDEBUG=-all
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export DXVK_LOG_PATH=none DXVK_STATE_CACHE=0
          T="$RUNNER_TEMP/d3d11test"
          mkdir -p "$T"
          # Creates a device, clears a render target on the GPU, reads the pixel back.
          x86_64-w64-mingw32-gcc -O2 -o "$T/t64.exe" .github/wine-crossover/d3d11test.c -ld3d11 -ldxguid
          i686-w64-mingw32-gcc -O2 -o "$T/t32.exe" .github/wine-crossover/d3d11test.c -ld3d11 -ldxguid
          run() { perl -e 'alarm 300; exec @ARGV' /opt/local/bin/wine "$@" 2>&1 | grep -v mvk || true; }

          # wined3d over OpenGL. The runner has no window server session, so
          # this is reported but not required.
          for b in 64 32; do
            OUT=$(run "$T/t$b.exe")
            echo "wined3d $b-bit: $(echo "$OUT" | grep -E 'd3d11-(ok|fail)')"
          done

          # DXVK over MoltenVK, installed into the prefix by wine-dxvk.
          /opt/local/bin/wine-dxvk install
          /opt/local/bin/wine-dxvk status
          for b in 64 32; do
            OUT=$(run "$T/t$b.exe")
            echo "$OUT" | grep -E 'DXVK: v|d3d11-(ok|fail)|err:'
            echo "$OUT" | grep -q 'DXVK: v' || { echo "FAIL: DXVK was not loaded ($b-bit)"; exit 1; }
            echo "$OUT" | grep -q d3d11-ok || { echo "FAIL: DXVK D3D11 test failed ($b-bit)"; exit 1; }
          done
          /opt/local/bin/wine-dxvk uninstall
          /opt/local/bin/wine-dxvk status | grep -q 'd3d11: wine' || { echo "FAIL: wine-dxvk uninstall"; exit 1; }
          /opt/local/bin/wineserver -k || true
          echo "PASS: DXVK renders through MoltenVK in 64-bit and 32-bit"

      - name: Clean port work directory
        if: always()
        run: |
          source ./setupenv.bash
          sudo port clean --work wine-crossover
          rm -rf "$RUNNER_TEMP/wineprefix" "$RUNNER_TEMP/d3d11test"
