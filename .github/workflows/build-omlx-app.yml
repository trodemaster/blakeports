name: Build omlx-app

# Current macOS only (27): the app is a SwiftUI menu bar app built with
# xcodebuild, and it tracks the latest SDK (0.7.0 already needs the macOS 26
# SDK's Glass API, so the 15 runner can't build it).

on:
  push:
    paths: ['aqua/omlx-app/**']
    branches: [main]
  pull_request:
    paths: ['aqua/omlx-app/**']
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'main'
        type: string

defaults:
  run:
    shell: bash

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          MATRIX='{"include":['
          FIRST=true

          add() {
            [[ "$FIRST" == "false" ]] && MATRIX+=','
            MATRIX+="{\"platform\":\"$1\",\"runner\":\"$1\",\"port\":\"aqua/omlx-app\"}"
            FIRST=false
          }

          # Current macOS only, for push, PR and dispatch alike
          add macOS_27

          MATRIX+=']}'

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for trigger: ${{ github.event_name }}"
          echo "$MATRIX" | jq '.'

  build-omlx-app:
    needs: setup-matrix
    name: build-omlx-app (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Gather system information
        id: system-info
        continue-on-error: true
        run: |
          echo "Running on: ${{ matrix.platform }}"
          echo "Building port: omlx-app"
          echo "Building from branch: ${{ inputs.branch || github.ref_name }}"

          # Use centralized system info script
          eval $(./scripts/getsysteminfo)

          echo "macos_version=${MACOS_VERSION}" >> $GITHUB_OUTPUT
          echo "macos_major=${MACOS_MAJOR}" >> $GITHUB_OUTPUT
          echo "macos_minor=${MACOS_MINOR}" >> $GITHUB_OUTPUT
          echo "macos_build=${MACOS_BUILD}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT
          echo "xcode_version=${XCODE_VERSION}" >> $GITHUB_OUTPUT
          echo "clt_version=${CLT_VERSION}" >> $GITHUB_OUTPUT

          echo ""
          echo "System Information:"
          sw_vers || echo "⚠️  Could not determine macOS version"
          echo ""
          echo "Xcode Version: ${XCODE_VERSION}"
          echo "Command Line Tools: ${CLT_VERSION}"
          echo "Architecture: ${ARCH}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup MacPorts and BlakePorts Environment
        run: ./scripts/installmacports

      - name: Lint portfile
        run: |
          source ./setupenv.bash
          port lint --nitpick ${{ matrix.port }}

      - name: Clean existing installation
        run: |
          source ./setupenv.bash
          if port installed omlx-app | grep -q omlx-app; then
            echo "Removing existing omlx-app installation..."
            sudo port uninstall omlx-app
            sudo port clean --dist omlx-app
          else
            echo "No existing omlx-app installation found"
          fi

      - name: Install dependencies
        run: ./scripts/install-deps omlx-app

      - name: Build port
        run: |
          source ./setupenv.bash
          sudo port -v install omlx-app

      - name: Verify installation
        run: |
          source ./setupenv.bash
          port installed omlx-app
          APP=/Applications/MacPorts/oMLX.app
          ls -la "$APP/Contents/MacOS/"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/oMLX"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          test -x /opt/local/bin/omlx-app
          sh -n /opt/local/bin/omlx-app
